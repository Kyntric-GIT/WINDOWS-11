<style>

.titlebar{height:43px;min-height:43px;display:flex;align-items:center;padding:0 0 0 13px;background:#e9eef8;font-size:13px;font-weight:600;user-select:none;touch-action:none;cursor:grab}.titlebar:active{cursor:grabbing}.win-title{flex:1;display:flex;align-items:center;gap:9px}.win-controls{height:100%;display:flex}.win-controls button{border:0;background:transparent;font-size:17px;width:43px;height:100%;cursor:pointer;color:#26334a}.win-controls button:hover{background:#dce4ef}.win-controls .close:hover{background:#e45b5b;color:white}.window-body{padding:20px;overflow:auto;flex:1;min-height:0;color:#172238}.window-body h2{font-weight:600;margin:0 0 12px}.window-body p{color:#526079;line-height:1.5}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:#f5f7fb;border-bottom:1px solid #e1e6ee}.toolbar button,.action{border:0;border-radius:6px;background:#e6edf7;color:#1d2b40;padding:8px 12px;cursor:pointer}.primary{background:#1769d2!important;color:white!important}.field{border:1px solid #cbd5e1;border-radius:6px;padding:9px;color:#172238;background:white;max-width:100%}.tile-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-top:17px}.tile,.store-card,.file-row{padding:13px;border:1px solid #dbe2ee;border-radius:8px;background:#fff;color:#172238}.tile b{display:block;margin:5px 0}.muted{color:#64748b;font-size:12px}.store-card,.file-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}.store-card button,.file-row button{border:0;border-radius:5px;padding:8px 11px;background:#1769d2;color:white;cursor:pointer}.status{display:inline-flex;align-items:center;gap:7px;border-radius:20px;background:#fff2d5;color:#815500;padding:6px 10px;font-size:12px}.codearea{width:100%;min-height:230px;border:1px solid #cbd5e1;border-radius:6px;padding:12px;font:13px Consolas,monospace;color:#172238}.notice{position:fixed;z-index:2000;right:16px;bottom:72px;background:#fff;color:#172238;padding:12px 16px;border-radius:8px;box-shadow:0 8px 35px #0005;display:none}.notice.show{display:block}.context{position:fixed;z-index:2200;background:#fff;color:#172238;padding:6px;border:1px solid #dce3eb;border-radius:8px;box-shadow:0 10px 30px #0005;min-width:180px}.context button{display:block;width:100%;text-align:left;border:0;background:white;padding:9px;border-radius:5px;cursor:pointer}.context button:hover{background:#eaf1f8}.terminal{background:#101820;color:#d8f5dc;padding:15px;height:100%;font:13px Consolas,monospace}.terminal input{background:transparent;border:0;color:white;outline:0}.game-frame{width:100%;height:100%;border:0;background:#000;display:block}.window:has(.game-frame) .window-body{padding:0;overflow:hidden}.bg-options{display:flex;gap:9px;flex-wrap:wrap}.bg-chip{width:94px;height:62px;border:2px solid #d7deea;border-radius:7px;cursor:pointer}.bg-chip:focus{outline:2px solid var(--accent)}@media(max-width:620px){.app-grid{grid-template-columns:repeat(3,1fr)}.task-left{display:none}.tray{right:7px}.task-center{margin-right:92px;max-width:calc(100vw - 110px)}.start-menu{padding:14px}}

.system-panel{display:none;position:fixed;z-index:1250;right:14px;bottom:68px;width:min(360px,calc(100vw - 28px));padding:16px;background:rgba(25,37,61,.96);backdrop-filter:blur(28px);border:1px solid #ffffff2b;border-radius:14px;box-shadow:0 18px 60px #0008;color:#f7f9ff}.system-panel.open{display:block}.system-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.system-toggle{padding:13px;border:1px solid #ffffff20;border-radius:9px;background:#ffffff12;color:white;text-align:left;cursor:pointer}.system-toggle.on{background:color-mix(in srgb,var(--accent) 42%,#ffffff18);border-color:var(--accent)}.system-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #ffffff18;font-size:13px}.system-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.system-actions button,.tray button{border:0;border-radius:7px;padding:8px 10px;background:#ffffff18;color:white;cursor:pointer}.tray button{background:transparent}.tray button:hover{background:#ffffff20}.all-apps-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}.all-apps-list .app{text-align:left;display:flex;align-items:center;gap:9px;padding:9px}.all-apps-list .app span{font-size:20px;margin:0}
</style></head><body>
<main class="desktop" id="desktop"><div class="wallpaper" id="wallpaper"></div><div class="icons" id="desktopIcons"></div></main>
<section class="panel start-menu" id="startMenu"><input class="search" id="appSearch" placeholder="🔎 Search apps"><div class="panel-head"><span>Default apps</span><span>WINDOWS-11</span></div><div class="app-grid" id="defaultGrid"></div><div class="panel-head"><span>Installed apps</span><span id="installedCount"></span></div><div class="app-grid" id="installedGrid"></div><div class="panel-head"><span>All Apps</span><span>A–Z</span></div><div class="all-apps-list" id="allAppsGrid"></div><div class="panel-head"><span>Recommended</span><span>Recent</span></div><p class="muted">Recently opened applications stay available on your taskbar.</p><div class="panel-head"><span>Power</span><button class="action" id="exitBtn">Close menu</button></div></section>
<footer class="taskbar" id="taskbar"><span class="task-left">WINDOWS-11</span><div class="task-center" id="taskCenter"></div><div class="tray"><button id="quickBtn" title="Quick settings">◖◗　⌁</button><button id="notifyBtn" title="Notifications and calendar">◷</button><div class="clock"><div id="time"></div><div id="date"></div></div></div></footer>
<section class="system-panel" id="quickPanel"><b>Quick settings</b><div class="system-grid" style="margin-top:12px">
<button class="system-toggle on" data-toggle="wifi">◖◗ Wi-Fi<br><small>Connected (simulated)</small></button>
<button class="system-toggle" data-toggle="bluetooth">ᛒ Bluetooth<br><small>Off</small></button>
<button class="system-toggle on" data-toggle="volume">🔊 Volume<br><small>On</small></button>
<button class="system-toggle on" data-toggle="brightness">☀ Brightness<br><small>On</small></button>
<button class="system-toggle" data-toggle="battery">🔋 Battery saver<br><small>Off</small></button>

<section class="system-panel" id="notifyPanel"><b>Notifications & calendar</b><div id="notificationItems" class="muted" style="padding:18px 0">You're all caught up.</div><div class="system-row"><span id="calendarDate"></span><b id="calendarTime"></b></div><div class="system-actions"><button data-system="dnd">Do Not Disturb</button><button data-system="clear">Clear notifications</button><button data-system="close">Close</button></div></section>
<div class="notice" id="notice"></div>
<script>
const EAGLER_URL="https://sparkling-dream-5f35.kyntric-git.workers.dev/game";
const DEFAULTS=["thispc","files","settings","store","browser","about","eaglercraft"];
const CATALOG=[
{id:"thispc",name:"This PC",icon:"🖥️",desc:"Your Web Edition workspace.",default:true},
{id:"files",name:"File Explorer",icon:"📁",desc:"Browse and edit virtual files and game metadata.",default:true},
{id:"settings",name:"Settings",icon:"⚙️",desc:"Wallpaper, taskbar and app visibility.",default:true},
{id:"store",name:"App Store",icon:"🛍️",desc:"Install desktop apps.",default:true},
{id:"browser",name:"Rammerhead Browser",icon:"🌐",desc:"Open your configured Rammerhead instance.",default:true},
{id:"about",name:"About",icon:"ℹ️",desc:"About WINDOWS-11 Web Edition.",default:true},
{id:"eaglercraft",name:"Eaglercraft 26.2",icon:"🎮",desc:"Minecraft 26.2 browser game.",default:true},
{id:"calculator",name:"Calculator",icon:"🧮",desc:"Basic desktop calculator."},
{id:"notepad",name:"Notepad",icon:"📝",desc:"Write and save notes."},
{id:"paint",name:"Paint",icon:"🎨",desc:"A simple drawing pad."},
{id:"media",name:"Media Player",icon:"🎵",desc:"Play supported audio/video URLs."},
{id:"terminal",name:"Terminal",icon:"⌨️",desc:"A simulated desktop command prompt."},
{id:"games",name:"Game Library",icon:"🕹️",desc:"Import browser game URLs."}
];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let installed=read("w11-installed",DEFAULTS.slice()),pinned=read("w11-pinned",["thispc","files","store","eaglercraft"]),hideExtras=read("w11-hide-extras",false),games=read("w11-games",[]),vfiles=read("w11-files",{"Documents/Welcome.txt":"Welcome to WINDOWS-11 Web Edition.","Games/README.txt":"Game metadata and editable local data are stored here."}),wins=new Map(),z=30,wallChoice=localStorage.getItem("w11-wallpaper")||"blue";
function info(id){return CATALOG.find(a=>a.id===id)||games.find(g=>g.id===id)||{id,name:id,icon:"📦",desc:"Installed app."}}
function say(t){const n=$("#notice");n.textContent=t;n.classList.add("show");clearTimeout(say.timer);say.timer=setTimeout(()=>n.classList.remove("show"),2600)}
function allowed(a){return !hideExtras||DEFAULTS.includes(a.id)}
function allInstalled(){return installed.map(info).filter(allowed)}
function appButton(a){return '<button class="app" data-launch="'+esc(a.id)+'"><span>'+a.icon+'</span>'+esc(a.name)+'</button>'}
function renderStart(){const apps=allInstalled();$("#defaultGrid").innerHTML=apps.filter(a=>DEFAULTS.includes(a.id)).map(appButton).join("");$("#allAppsGrid").innerHTML=[...apps].sort((a,b)=>a.name.localeCompare(b.name)).map(appButton).join("");$("#installedGrid").innerHTML=apps.filter(a=>!DEFAULTS.includes(a.id)).map(appButton).join("")||'<p class="muted">No additional apps installed.</p>';$("#installedCount").textContent=apps.filter(a=>!DEFAULTS.includes(a.id)).length+" installed";$("#startMenu").querySelectorAll("[data-launch]").forEach(b=>b.onclick=()=>openApp(b.dataset.launch));$("#appSearch").oninput=e=>{let q=e.target.value.toLowerCase();document.querySelectorAll("#startMenu [data-launch]").forEach(b=>b.style.display=b.textContent.toLowerCase().includes(q)?"":"none")}}
function renderDesktop(){const apps=allInstalled();$("#desktopIcons").innerHTML=apps.map(a=>'<button class="desk-icon" data-desktop-app="'+esc(a.id)+'"><span class="glyph">'+a.icon+'</span>'+esc(a.name)+'</button>').join("");$("#desktopIcons").querySelectorAll("[data-desktop-app]").forEach(b=>{b.addEventListener("dblclick",()=>openApp(b.dataset.desktopApp));b.addEventListener("contextmenu",e=>{e.preventDefault();appContext(e.clientX,e.clientY,b.dataset.desktopApp)})})}
function renderTaskbar(){const ids=[...new Set([...pinned,...wins.keys()])].filter(id=>installed.includes(id)||wins.has(id));$("#taskCenter").innerHTML='<button class="taskbtn start" id="startBtn" title="Start">⊞</button>'+ids.map(id=>{let a=info(id);return '<button class="taskbtn '+(pinned.includes(id)?"pinned ":"")+(wins.has(id)?"running":"")+'" data-task-app="'+esc(id)+'" title="'+esc(a.name)+'">'+a.icon+'</button>'}).join("");$("#startBtn").onclick=()=>{$("#startMenu").classList.toggle("open");renderStart()};$("#taskCenter").querySelectorAll("[data-task-app]").forEach(b=>{b.onclick=()=>{const id=b.dataset.taskApp;if(wins.has(id)){const w=wins.get(id);w.classList.add("open");focus(w)}else openApp(id)};b.oncontextmenu=e=>{e.preventDefault();appContext(e.clientX,e.clientY,b.dataset.taskApp)}});$("#taskCenter").querySelectorAll("[data-task-app]").forEach(b=>{b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData("text/plain",b.dataset.taskApp);b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();const from=e.dataTransfer.getData("text/plain"),to=b.dataset.taskApp;if(pinned.includes(from)&&pinned.includes(to)){pinned.splice(pinned.indexOf(from),1);pinned.splice(pinned.indexOf(to),0,from);save("w11-pinned",pinned);renderTaskbar()}}})}
function focus(w){w.style.zIndex=++z}
function appContext(x,y,id){document.querySelector(".context")?.remove();const m=document.createElement("div");m.className="context";m.style.left=Math.min(x,innerWidth-195)+"px";m.style.top=Math.min(y,innerHeight-155)+"px";const pin=pinned.includes(id);m.innerHTML='<button data-cmd="open">Open</button><button data-cmd="pin">'+(pin?"Unpin from taskbar":"Pin to taskbar")+'</button><button data-cmd="close">Close window</button>';document.body.append(m);m.onclick=e=>{const c=e.target.dataset.cmd;if(c==="open")openApp(id);if(c==="pin"){pinned=pin?pinned.filter(x=>x!==id):[...pinned,id];save("w11-pinned",pinned);renderTaskbar()}if(c==="close"&&wins.has(id)){wins.get(id).remove();wins.delete(id);renderTaskbar()}m.remove()};setTimeout(()=>document.addEventListener("click",()=>m.remove(),{once:true}),0)}
function openApp(id){if(!installed.includes(id)){say("Install this app from the App Store first.");return}if(wins.has(id)){const w=wins.get(id);w.classList.add("open");focus(w);renderTaskbar();$("#startMenu").classList.remove("open");return}const a=info(id),w=document.createElement("section");w.className="window open";w.dataset.app=id;w.style.zIndex=++z;w.innerHTML='<header class="titlebar"><div class="win-title"><span>'+a.icon+'</span><span>'+esc(a.name)+'</span></div><div class="win-controls"><button data-win="min" title="Minimize">—</button><button data-win="max" title="Maximize / Restore">□</button><button class="close" data-win="close" title="Close">×</button></div></header><div class="window-body">'+appContent(id)+'</div>';$("#desktop").append(w);wins.set(id,w);w.addEventListener("mousedown",()=>focus(w));w.querySelectorAll("[data-win]").forEach(b=>b.onclick=()=>{const act=b.dataset.win;if(act==="min")w.classList.remove("open");if(act==="max"){const was=w.classList.contains("maximized");w.classList.remove("maximized","snap-left","snap-right","snap-tl","snap-tr","snap-bl","snap-br");if(!was)w.classList.add("maximized")}if(act==="close"){w.remove();wins.delete(id)}renderTaskbar()});makeDraggable(w);w.addEventListener("click",appClick);w.addEventListener("submit",appSubmit);w.addEventListener("input",appInput);w.addEventListener("change",appChange);renderTaskbar();$("#startMenu").classList.remove("open");if(id==="store")renderStore(w);if(id==="files")renderFiles(w);if(id==="games")renderGames(w);if(id==="paint")setupPaint(w)}
function appContent(id){
if(id==="thispc")return '<h2>This PC</h2><p>Welcome to your Windows-style web desktop. Your files are stored in this browser, not on the host computer.</p><div class="tile-row"><div class="tile">💽<b>Web Edition (C:)</b><span class="muted">Virtual storage</span></div><div class="tile">🎮<b>Games</b><span class="muted">Game data and metadata</span></div><div class="tile">📁<b>Documents</b><span class="muted">Local browser storage</span></div></div>';
if(id==="files")return '<div class="toolbar"><b>📁 File Explorer</b><button data-act="newfile">＋ New file</button><button data-act="newfolder">＋ New folder</button></div><p class="muted">Virtual file manager. Game entries include editable local metadata. Editing this copy does not change remote game source code or online saves.</p><div id="fileList"></div><div id="fileEdit" style="margin-top:12px"></div>';
if(id==="store")return '<h2>Microsoft-style App Store</h2><p>Install apps into this desktop. Installed apps appear in Start and on the desktop; right-click an app to pin it to the taskbar.</p><div id="storeList"></div>';
if(id==="settings")return '<h2>Personalization & Settings</h2><h3>Background selection</h3><div class="bg-options"><button class="bg-chip" data-bg="blue" style="background:linear-gradient(135deg,#061b3c,#3189db)">Blue</button><button class="bg-chip" data-bg="purple" style="background:linear-gradient(135deg,#241344,#bd7cff)">Purple</button><button class="bg-chip" data-bg="sunset" style="background:linear-gradient(135deg,#ffbd87,#a13b75)">Sunset</button><button class="bg-chip" data-bg="forest" style="background:linear-gradient(135deg,#c4dca6,#164e3b)">Forest</button><button class="bg-chip" data-bg="dark" style="background:linear-gradient(135deg,#101827,#26354e)">Midnight</button></div><p>Custom image background: <input class="field" type="file" id="bgUpload" accept="image/*"></p><p>Accent color: <input type="color" id="accentPick" value="'+(localStorage.getItem("w11-accent")||"#5b9cff")+'"></p><label><input type="checkbox" id="hideExtras" '+(hideExtras?"checked":"")+'> Hide all non-default apps</label><hr><h3>Rammerhead browser</h3><p class="muted">Paste the URL of your Rammerhead instance. The browser opens it in a new tab because many proxy pages block iframe embedding.</p><input class="field" id="rammerheadInput" placeholder="https://your-rammerhead-instance/"><button class="action primary" data-act="save-rh">Save address</button><hr><h3>Taskbar</h3><p class="muted">Right-click taskbar app icons to pin/unpin. Drag pinned icons to reorder them.</p><label>Taskbar alignment <select class="field" id="taskAlign"><option value="center">Centered</option><option value="left">Left</option></select></label>';
if(id==="browser")return '<h2>Rammerhead Browser</h2><p>Enter a website or search query. This opens through your configured Rammerhead instance.</p><input class="field" id="rhAddress" style="width:min(100%,560px)" placeholder="Website address or search"><button class="action primary" data-act="rh-go">Go ↗</button><p class="muted">Configure your instance in Settings. This desktop does not host the Rammerhead service.</p><button class="action" data-act="rh-home">Open Rammerhead home ↗</button>';
if(id==="about")return '<h2>About WINDOWS-11</h2><p>WINDOWS-11 Web Desktop is a browser-based desktop simulation inspired by Windows 11. It is not the Windows operating system and cannot run arbitrary Windows .exe programs.</p><p>App settings and virtual files are saved in this browser profile.</p>';
if(id==="eaglercraft"){return '<div style="height:100%;min-height:300px;display:flex;flex-direction:column;background:#101820;color:white"><div class="toolbar"><span>🎮 Eaglercraft 26.2</span><button data-act="game-tab">Open in new tab ↗</button></div><iframe class="game-frame" title="Eaglercraft 26.2" allow="fullscreen; gamepad; autoplay" allowfullscreen src="'+EAGLER_URL+'"></iframe></div>'}
if(id==="calculator")return '<h2>Calculator</h2><input class="field" id="calcDisplay" value="0" readonly style="width:100%;text-align:right;font-size:25px;margin-bottom:10px"><div class="app-grid" style="grid-template-columns:repeat(4,1fr)">'+["7","8","9","÷","4","5","6","×","1","2","3","−","0",".","C","+","="].map(x=>'<button class="action" data-calc="'+x+'">'+x+'</button>').join("")+'</div>';
if(id==="notepad")return '<div class="toolbar"><button data-act="save-note">Save note</button></div><textarea id="noteText" class="codearea" style="height:calc(100% - 52px);border:0" placeholder="Start typing...">'+esc(localStorage.getItem("w11-note")||"")+'</textarea>';
if(id==="paint")return '<h2>Paint</h2><input type="color" id="paintColor" value="#1769d2"><button class="action" data-act="paint-clear">Clear</button><canvas id="paintCanvas" width="900" height="480" style="display:block;width:100%;height:auto;border:1px solid #ccd5e2;touch-action:none;margin-top:10px"></canvas>';
if(id==="media")return '<h2>Media Player</h2><input class="field" id="mediaUrl" style="width:80%" placeholder="Direct audio/video URL"><button class="action" data-act="media-play">Play</button><div id="mediaSlot"></div>';
if(id==="terminal")return '<div class="terminal"><div>WINDOWS-11 Web Edition terminal<br>Commands: help, date, apps, clear</div><div id="termOut"></div><form id="termForm">C:\\&gt; <input id="termInput" autocomplete="off"></form></div>';
if(id==="games")return '<h2>Game Library</h2><p>Import a published browser game URL. A local editable game.json entry will be created in File Explorer.</p><button class="action primary" data-act="import-game">＋ Import game</button><div id="gamesList"></div>';
const g=games.find(x=>x.id===id);if(g)return '<h2>🎮 '+esc(g.name)+'</h2><p>'+esc(g.url)+'</p><button class="action primary" data-act="open-game">Launch game ↗</button><button class="action" data-act="edit-game">Edit game data in File Explorer</button><p class="muted">Game data folder: Games/'+esc(g.id)+'/</p>';
return '<h2>'+esc(info(id).name)+'</h2><p>'+esc(info(id).desc||"")+'</p>';
}
function makeDraggable(w){const bar=w.querySelector(".titlebar");let sx=0,sy=0,left=0,top=0;bar.addEventListener("pointerdown",e=>{if(e.target.closest(".win-controls")||w.classList.contains("maximized"))return;const r=w.getBoundingClientRect();sx=e.clientX;sy=e.clientY;left=r.left;top=r.top;bar.setPointerCapture(e.pointerId);const move=ev=>{w.style.left=(left+ev.clientX-sx)+"px";w.style.top=(top+ev.clientY-sy)+"px";w.style.transform="none";w.classList.remove("snap-left","snap-right","snap-tl","snap-tr","snap-bl","snap-br")};const up=ev=>{bar.removeEventListener("pointermove",move);bar.removeEventListener("pointerup",up);const x=ev.clientX,y=ev.clientY,edge=22;w.style.width="";w.style.height="";if(y<edge){w.classList.add("maximized");w.style.left="";w.style.top="";w.style.transform=""}else if(x<edge&&y<innerHeight/2)w.classList.add("snap-tl");else if(x>innerWidth-edge&&y<innerHeight/2)w.classList.add("snap-tr");else if(x<edge&&y>innerHeight/2)w.classList.add("snap-bl");else if(x>innerWidth-edge&&y>innerHeight/2)w.classList.add("snap-br");else if(x<edge)w.classList.add("snap-left");else if(x>innerWidth-edge)w.classList.add("snap-right")};bar.addEventListener("pointermove",move);bar.addEventListener("pointerup",up)})}
function renderStore(w){const box=w.querySelector("#storeList");box.innerHTML=CATALOG.filter(a=>!a.default).map(a=>'<div class="store-card"><div><b>'+a.icon+' '+esc(a.name)+'</b><div class="muted">'+esc(a.desc)+'</div></div><button data-install="'+a.id+'">'+(installed.includes(a.id)?"Installed":"Install")+'</button></div>').join("")+games.map(g=>'<div class="store-card"><div><b>🎮 '+esc(g.name)+'</b><div class="muted">Imported browser game</div></div><button disabled>Installed</button></div>').join("");box.querySelectorAll("[data-install]").forEach(b=>b.onclick=()=>{const id=b.dataset.install;if(installed.includes(id))return say("Already installed");installed.push(id);save("w11-installed",installed);renderStore(w);renderStart();renderDesktop();renderTaskbar();say(info(id).name+" installed")})}
function renderFiles(w){const box=w.querySelector("#fileList");box.innerHTML=Object.keys(vfiles).sort().map(k=>'<div class="file-row"><div>📄 <b>'+esc(k)+'</b><div class="muted">'+String(vfiles[k]).length+' characters</div></div><button data-edit-file="'+esc(k)+'">Edit</button></div>').join("");box.querySelectorAll("[data-edit-file]").forEach(b=>b.onclick=()=>editVirtualFile(w,b.dataset.editFile))}
function editVirtualFile(w,k){const area=w.querySelector("#fileEdit");area.innerHTML='<b>Editing '+esc(k)+'</b><textarea class="codearea" id="fileText">'+esc(vfiles[k])+'</textarea><button class="action primary" data-act="save-file">Save file</button>';area.dataset.path=k}
function renderGames(w){const box=w.querySelector("#gamesList");box.innerHTML=games.map(g=>'<div class="file-row"><div>🎮 <b>'+esc(g.name)+'</b><div class="muted">'+esc(g.url)+'</div></div><button data-launch="'+esc(g.id)+'">Open</button></div>').join("")||'<p class="muted">No imported games yet.</p>';box.querySelectorAll("[data-launch]").forEach(b=>b.onclick=()=>openApp(b.dataset.launch))}
function importGame(){const url=prompt("Paste a published browser game URL:");if(!url)return;let u=url.trim();if(!/^https?:\/\//i.test(u))return say("Enter a full https:// URL");const name=prompt("Game name:","My browser game")||"My browser game";const id="game-"+Date.now();const g={id,name,icon:"🎮",url:u,desc:"Imported browser game"};games.push(g);installed.push(id);vfiles["Games/"+id+"/game.json"]=JSON.stringify({name,url:u,settings:{},notes:"Edit this local metadata as needed."},null,2);save("w11-games",games);save("w11-installed",installed);save("w11-files",vfiles);renderStart();renderDesktop();renderTaskbar();const gw=[...wins.values()].find(x=>x.dataset.app==="games");if(gw)renderGames(gw);say(name+" installed; data folder created")}
function appClick(e){const b=e.target.closest("[data-act],[data-calc]");if(!b)return;const act=b.dataset.act,w=b.closest(".window"),id=w?.dataset.app;
if(act==="newfile"||act==="newfolder"){const name=prompt("Enter a virtual path/name (example: Documents/new.txt):");if(name){vfiles[name]=act==="newfolder"?"[Virtual folder]":"";save("w11-files",vfiles);renderFiles(w)}}
if(act==="save-file"){const k=w.querySelector("#fileEdit").dataset.path;vfiles[k]=w.querySelector("#fileText").value;save("w11-files",vfiles);say("Saved "+k);renderFiles(w)}
if(act==="save-rh"){const v=w.querySelector("#rammerheadInput").value.trim();if(!/^https?:\/\//i.test(v))return say("Enter a valid http(s) instance URL");localStorage.setItem("w11-rammerhead",v);say("Rammerhead address saved")}
if(act==="rh-go"||act==="rh-home"){let base=localStorage.getItem("w11-rammerhead")||"";let val=act==="rh-home"?base:w.querySelector("#rhAddress").value.trim();if(!base)return say("Set your Rammerhead instance URL in Settings first");let url=base;if(act==="rh-go"&&val){say("Rammerhead opened. Enter the destination in its own address bar.");}window.open(url,"_blank","noopener,noreferrer")}
if(act==="game-tab")window.open(EAGLER_URL,"_blank","noopener,noreferrer");
if(act==="import-game")importGame();
if(act==="open-game"||act==="edit-game"){const g=games.find(x=>x.id===id);if(g&&act==="open-game")window.open(g.url,"_blank","noopener,noreferrer");if(g&&act==="edit-game"){openApp("files");setTimeout(()=>{const fw=wins.get("files");if(fw)editVirtualFile(fw,"Games/"+g.id+"/game.json")},100)}}
if(act==="save-note"){localStorage.setItem("w11-note",w.querySelector("#noteText").value);say("Note saved")}
if(act==="paint-clear"){const c=w.querySelector("#paintCanvas");c.getContext("2d").clearRect(0,0,c.width,c.height)}
if(act==="media-play"){const u=w.querySelector("#mediaUrl").value.trim();if(!/^https?:\/\//i.test(u))return say("Enter a direct media URL");w.querySelector("#mediaSlot").innerHTML=/\\.(mp4|webm|ogg)(\\?.*)?$/i.test(u)?'<video controls style="width:100%" src="'+esc(u)+'"></video>':'<audio controls style="width:100%" src="'+esc(u)+'"></audio>'}
if(b.dataset.calc){const d=w.querySelector("#calcDisplay"),v=b.dataset.calc;if(v==="C")d.value="0";else if(v==="="){try{const x=d.value.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");if(!/^[0-9+*/(). -]+$/.test(x))throw 0;d.value=String(Function('"use strict";return ('+x+')')())}catch{d.value="Error"}}else d.value=d.value==="0"?v:d.value+v}
}
function appInput(e){if(e.target.id==="accentPick"){document.documentElement.style.setProperty("--accent",e.target.value);localStorage.setItem("w11-accent",e.target.value)}}
function appChange(e){if(e.target.id==="hideExtras"){hideExtras=e.target.checked;save("w11-hide-extras",hideExtras);renderStart();renderDesktop();renderTaskbar()}if(e.target.id==="bgUpload"&&e.target.files[0]){const f=e.target.files[0];if(f.size>2_500_000)return say("Choose an image under 2.5 MB");const r=new FileReader();r.onload=()=>{localStorage.setItem("w11-custom-bg",r.result);$("#wallpaper").style.backgroundImage='url("'+r.result+'")';say("Custom wallpaper applied")};r.readAsDataURL(f)}if(e.target.id==="taskAlign"){$("#taskCenter").style.marginLeft=e.target.value==="left"?"65px":"0";$("#taskCenter").style.marginRight=e.target.value==="left"?"auto":"0";localStorage.setItem("w11-task-align",e.target.value)}}
function appSubmit(e){if(e.target.id==="termForm"){e.preventDefault();const q=e.target.querySelector("#termInput").value.trim(),out=e.target.querySelector("#termOut");let r=q==="help"?"help, date, apps, clear":q==="date"?new Date().toString():q==="apps"?installed.map(x=>info(x).name).join(", "):q==="clear"?"":"Command not found";out.textContent+="\\n"+q+"\\n"+r;e.target.querySelector("#termInput").value=""}}
function setupPaint(w){const c=w.querySelector("#paintCanvas"),ctx=c.getContext("2d");let down=false;c.addEventListener("pointerdown",e=>{down=true;const r=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height);c.setPointerCapture(e.pointerId)});c.addEventListener("pointermove",e=>{if(!down)return;const r=c.getBoundingClientRect();ctx.strokeStyle=w.querySelector("#paintColor").value;ctx.lineWidth=4;ctx.lineCap="round";ctx.lineTo((e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height);ctx.stroke()});c.addEventListener("pointerup",()=>down=false)}
function setWallpaper(name){const map={blue:"radial-gradient(ellipse at 72% 46%,#2875d3,transparent 38%),linear-gradient(135deg,#07152d,#142c5b 55%,#08162f)",purple:"radial-gradient(circle at 70% 45%,#bd7cff,transparent 38%),linear-gradient(135deg,#241344,#594080)",sunset:"linear-gradient(135deg,#ffbd87,#a13b75 60%,#34265f)",forest:"linear-gradient(135deg,#c4dca6,#397b55 55%,#123c32)",dark:"linear-gradient(135deg,#101827,#26354e)"};$("#wallpaper").style.backgroundImage=map[name]||map.blue;localStorage.setItem("w11-wallpaper",name)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-bg]");if(b)setWallpaper(b.dataset.bg)});
document.addEventListener("click",e=>{if(e.target.id==="startBtn")$("#startMenu").classList.toggle("open");if(e.target.id==="exitBtn")$("#startMenu").classList.remove("open");if(!e.target.closest("#startMenu")&&!e.target.closest("#startBtn"))$("#startMenu").classList.remove("open")});
document.addEventListener("dblclick",e=>{const b=e.target.closest("[data-desktop-app]");if(b)openApp(b.dataset.desktopApp)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("#startMenu").classList.remove("open");document.querySelector(".context")?.remove()}});
function tick(){const d=new Date();$("#time").textContent=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});$("#date").textContent=d.toLocaleDateString([],{month:"numeric",day:"numeric",year:"numeric"})}

const systemState=read("w11-system-state",{wifi:true,bluetooth:false,volume:true,brightness:true,battery:false,accessibility:false,dnd:false});
function closeSystemPanels(){document.querySelectorAll(".system-panel").forEach(p=>p.classList.remove("open"))}
function toggleSystemPanel(id){const p=$("#"+id),was=p.classList.contains("open");closeSystemPanels();if(!was)p.classList.add("open")}
document.addEventListener("click",e=>{
 if(e.target.closest("#quickBtn")){toggleSystemPanel("quickPanel");return}
 if(e.target.closest("#notifyBtn")){toggleSystemPanel("notifyPanel");const d=new Date();$("#calendarDate").textContent=d.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});$("#calendarTime").textContent=d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});return}
 const t=e.target.closest("[data-toggle]");if(t){const k=t.dataset.toggle;systemState[k]=!systemState[k];save("w11-system-state",systemState);t.classList.toggle("on",systemState[k]);const sm=t.querySelector("small");if(sm)sm.textContent=systemState[k]?"On":"Off";return}
 const a=e.target.closest("[data-system]");if(a){const action=a.dataset.system;if(action==="close")closeSystemPanels();if(action==="settings"){closeSystemPanels();openApp("settings")}if(action==="dnd"){systemState.dnd=!systemState.dnd;save("w11-system-state",systemState);a.textContent=systemState.dnd?"Do Not Disturb: On":"Do Not Disturb"}if(action==="clear")$("#notificationItems").textContent="You're all caught up.";return}
 if(!e.target.closest(".system-panel"))closeSystemPanels();
});

function init(){installed=[...new Set([...DEFAULTS,...installed])];pinned=[...new Set(pinned.filter(x=>installed.includes(x)))];renderDesktop();renderStart();renderTaskbar();tick();setInterval(tick,15000);const bg=localStorage.getItem("w11-custom-bg");if(bg)$("#wallpaper").style.backgroundImage='url("'+bg+'")';else setWallpaper(wallChoice);const accent=localStorage.getItem("w11-accent");if(accent)document.documentElement.style.setProperty("--accent",accent);const align=localStorage.getItem("w11-task-align");if(align==="left")$("#taskCenter").style.marginLeft="65px"}
init();
</script></body></html>
